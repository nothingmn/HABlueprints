blueprint:
  name: ESP-NOW WLED Remote
  description: >
    Assign Home Assistant actions to a single ESP-NOW remote. This blueprint
    listens for the deduplicated wled_remote.button event produced by the
    ESP-NOW bridge setup.
  domain: automation
  input:
    remote_id:
      name: Remote ID
      description: >
        The remote_id from Developer Tools → Events, for example 72e5.
      selector:
        text:

    on_action:
      name: ON button
      default: []
      selector:
        action:

    off_action:
      name: OFF button
      default: []
      selector:
        action:

    night_action:
      name: NIGHT button
      default: []
      selector:
        action:

    button_1_action:
      name: Button 1
      default: []
      selector:
        action:

    button_2_action:
      name: Button 2
      default: []
      selector:
        action:

    button_3_action:
      name: Button 3
      default: []
      selector:
        action:

    button_4_action:
      name: Button 4
      default: []
      selector:
        action:

    brightness_down_action:
      name: Brightness down
      default: []
      selector:
        action:

    brightness_up_action:
      name: Brightness up
      default: []
      selector:
        action:

mode: queued
max: 20

variables:
  selected_remote_id: !input remote_id

triggers:
  - trigger: event
    event_type: wled_remote.button

conditions:
  - condition: template
    value_template: >
      {{ trigger.event.data.remote_id | string == selected_remote_id | string }}
  - condition: template
    value_template: >
      {{ trigger.event.data.press | default('single') == 'single' }}

actions:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.button == 'on' }}"
        sequence: !input on_action

      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.button == 'off' }}"
        sequence: !input off_action

      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.button == 'night' }}"
        sequence: !input night_action

      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.button == 'button_1' }}"
        sequence: !input button_1_action

      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.button == 'button_2' }}"
        sequence: !input button_2_action

      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.button == 'button_3' }}"
        sequence: !input button_3_action

      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.button == 'button_4' }}"
        sequence: !input button_4_action

      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.button == 'brightness_down' }}"
        sequence: !input brightness_down_action

      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.button == 'brightness_up' }}"
        sequence: !input brightness_up_action
